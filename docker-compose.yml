services:
  # 1. PostgreSQL Database Service
  db:
    image: postgres:16-alpine
    container_name: sownbarber_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sownbarber_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sownbarberpass}
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d sownbarber_db']
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Next.js Web App & CMS Admin Service
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sownbarber_web
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-sownbarberpass}@db:5432/${POSTGRES_DB:-sownbarber_db}?schema=public
      - JWT_SECRET=${JWT_SECRET:-sown-barbershop-super-secret-jwt-key-2026}
      - ADMIN_DEFAULT_PASSWORD=${ADMIN_DEFAULT_PASSWORD:-sownbarber2026}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:5051}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-http://localhost:5051}
    ports:
      - '5051:3000'
    volumes:
      # Mount uploaded images volume directly into host project folder
      - ./public/images/uploads:/app/public/images/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
