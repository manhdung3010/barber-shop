  <text x="300" y="328" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="18" font-weight="900" letter-spacing="2" fill="#F4F0E8">CẮT FADE CHUYÊN SÂU</text>
