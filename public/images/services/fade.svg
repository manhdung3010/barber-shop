  </defs>
  
  <rect width="600" height="400" rx="20" fill="url(#srvGlow2)"/>
  <rect x="16" y="16" width="568" height="368" rx="16" fill="none" stroke="rgba(199,166,106,0.25)" stroke-width="1.5"/>
  
