  <path d="M245 185 Q300 160 355 185" fill="none" stroke="url(#goldGrad2)" stroke-width="2" stroke-linecap="round" stroke-opacity="0.5"/>
  <path d="M240 205 Q300 180 360 205" fill="none" stroke="url(#goldGrad2)" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.3"/>

