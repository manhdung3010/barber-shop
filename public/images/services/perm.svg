<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <radialGradient id="srvGlow4" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#24221D"/>
      <stop offset="100%" stop-color="#0B0B0A"/>
    </radialGradient>
    <linearGradient id="goldGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4E2BE"/>
      <stop offset="50%" stop-color="#C7A66A"/>
      <stop offset="100%" stop-color="#8F7138"/>
    </linearGradient>
  </defs>
  
  <rect width="600" height="400" rx="20" fill="url(#srvGlow4)"/>
  <rect x="16" y="16" width="568" height="368" rx="16" fill="none" stroke="rgba(199,166,106,0.25)" stroke-width="1.5"/>
  
  <!-- Outer Badge Ring -->
  <circle cx="300" cy="170" r="75" fill="#141413" stroke="url(#goldGrad4)" stroke-width="2.5" stroke-dasharray="4 2"/>
  <circle cx="300" cy="170" r="62" fill="#0B0B0A" stroke="rgba(244,240,232,0.1)" stroke-width="1"/>

  <!-- Perm Curls & Texture Waves -->
  <!-- Upper Texture Wave -->
  <path d="M255 145 C270 125, 290 160, 305 140 C320 120, 335 155, 345 135" fill="none" stroke="url(#goldGrad4)" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Middle Volume Wave -->
  <path d="M250 172 C265 152, 285 187, 300 167 C315 147, 335 182, 350 162" fill="none" stroke="url(#goldGrad4)" stroke-width="3.5" stroke-linecap="round" stroke-opacity="0.85"/>
  <!-- Lower Root Volume Wave -->
  <path d="M260 198 C275 180, 290 210, 305 192 C320 174, 335 204, 345 188" fill="none" stroke="url(#goldGrad4)" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.6"/>

  <!-- Typography Labels -->
  <text x="300" y="295" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="4" fill="#C7A66A">TEXTURE &amp; ROOT VOLUME</text>
  <text x="300" y="328" text-anchor="middle" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="18" font-weight="900" letter-spacing="2" fill="#F4F0E8">UỐN TEXTURE ĐỊNH HÌNH</text>
</svg>
