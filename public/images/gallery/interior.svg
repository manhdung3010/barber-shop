    <rect x="-60" y="-80" width="120" height="140" rx="60" fill="none" stroke="url(#gold)" stroke-width="2"/>
    <circle cx="0" cy="-30" r="10" fill="#C7A66A"/>
  </g>
  <text x="400" y="700" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="12" font-weight="700" letter-spacing="5" fill="#C7A66A">STUDIO SPACE</text>
  <text x="400" y="740" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="26" font-weight="900" letter-spacing="2" fill="#F4F0E8">THE STUDIO SPACE</text>
  <text x="400" y="775" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="11" font-weight="400" letter-spacing="2" fill="#A7A39B">DARK MINIMALIST • PRIVATE SUITE</text>
