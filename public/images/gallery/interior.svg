      <stop offset="0%" stop-color="#1A1A18"/>
      <stop offset="80%" stop-color="#0B0B0A"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C88F"/>
      <stop offset="100%" stop-color="#96743A"/>
    </linearGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#galGlow3)"/>
  <rect x="60" y="60" width="680" height="880" rx="20" fill="none" stroke="rgba(244,240,232,0.06)" stroke-width="1.5"/>
