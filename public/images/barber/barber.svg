<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <radialGradient id="barberGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1E1E1C"/>
      <stop offset="70%" stop-color="#0B0B0A"/>
      <stop offset="100%" stop-color="#040404"/>
    </radialGradient>
    <linearGradient id="goldAcc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C88F"/>
      <stop offset="50%" stop-color="#C7A66A"/>
      <stop offset="100%" stop-color="#96743A"/>
    </linearGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#barberGlow)"/>

  <!-- Geometric Frame -->
  <rect x="50" y="50" width="700" height="900" rx="24" fill="none" stroke="rgba(244,240,232,0.08)" stroke-width="1.5"/>
  <rect x="70" y="70" width="660" height="860" rx="16" fill="none" stroke="rgba(199,166,106,0.15)" stroke-width="1" stroke-dasharray="6 6"/>

  <!-- Master Barber Emblem -->
  <circle cx="400" cy="400" r="180" fill="#141413" stroke="url(#goldAcc)" stroke-width="2"/>
  <circle cx="400" cy="400" r="150" fill="none" stroke="rgba(244,240,232,0.1)" stroke-width="1"/>

  <!-- Barber Shears & Straight Razor Crossed Motif -->
  <g transform="translate(400, 390) scale(1.1)">
    <line x1="-50" y1="-70" x2="50" y2="70" stroke="url(#goldAcc)" stroke-width="3" stroke-linecap="round"/>
    <line x1="50" y1="-70" x2="-50" y2="70" stroke="url(#goldAcc)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="-55" cy="-75" r="12" fill="none" stroke="url(#goldAcc)" stroke-width="2.5"/>
    <circle cx="55" cy="-75" r="12" fill="none" stroke="url(#goldAcc)" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="6" fill="#C7A66A"/>
  </g>

  <!-- Typography -->
  <text x="400" y="660" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="14" font-weight="700" letter-spacing="6" fill="#C7A66A">STUDIO MASTER</text>
  <text x="400" y="705" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="32" font-weight="900" letter-spacing="2" fill="#F4F0E8">THE BARBER</text>
  <text x="400" y="745" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="12" font-weight="300" letter-spacing="3" fill="#A7A39B">INDIVIDUAL ATTENTION • BESPOKE GROOMING</text>
</svg>
