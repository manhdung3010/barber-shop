<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <radialGradient id="heroGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1C1C1A"/>
      <stop offset="70%" stop-color="#0B0B0A"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C88F"/>
      <stop offset="50%" stop-color="#C7A66A"/>
      <stop offset="100%" stop-color="#96743A"/>
    </linearGradient>
    <linearGradient id="bladeShine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(244,240,232,0.05)"/>
      <stop offset="50%" stop-color="rgba(244,240,232,0.2)"/>
      <stop offset="100%" stop-color="rgba(244,240,232,0.05)"/>
    </linearGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#heroGlow)"/>

  <!-- Studio Ambient Lighting Lines -->
  <circle cx="400" cy="420" r="320" fill="none" stroke="rgba(199,166,106,0.12)" stroke-width="1.5" stroke-dasharray="8 8"/>
  <circle cx="400" cy="420" r="280" fill="none" stroke="rgba(244,240,232,0.06)" stroke-width="1"/>

  <!-- Editorial Silhouette & Craft Geometry -->
  <path d="M280 680 C280 500, 340 340, 400 320 C460 340, 520 500, 520 680 Z" fill="#141413" stroke="rgba(244,240,232,0.1)" stroke-width="2"/>
  <!-- Textured Hairline & Crop Fade Geometry -->
  <path d="M340 340 Q400 290 460 340 Q440 320 400 315 Q360 320 340 340 Z" fill="url(#goldAccent)"/>
  <path d="M320 420 Q400 360 480 420" fill="none" stroke="url(#goldAccent)" stroke-width="3" stroke-linecap="round"/>
  <path d="M330 450 Q400 400 470 450" fill="none" stroke="rgba(244,240,232,0.3)" stroke-width="2"/>
  <path d="M345 480 Q400 440 455 480" fill="none" stroke="rgba(244,240,232,0.15)" stroke-width="1.5"/>

  <!-- Precision Shears / Craft Iconography -->
  <g transform="translate(400, 560) scale(0.9)" opacity="0.85">
    <line x1="-60" y1="-80" x2="60" y2="80" stroke="url(#goldAccent)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="60" y1="-80" x2="-60" y2="80" stroke="url(#goldAccent)" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="-65" cy="-85" r="14" fill="none" stroke="url(#goldAccent)" stroke-width="2"/>
    <circle cx="65" cy="-85" r="14" fill="none" stroke="url(#goldAccent)" stroke-width="2"/>
    <circle cx="0" cy="0" r="5" fill="#C7A66A"/>
  </g>

  <!-- Editorial Typography Watermark -->
  <text x="400" y="780" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="13" font-weight="700" letter-spacing="6" fill="#C7A66A">PRECISION CRAFT &amp; MODERN FADES</text>
  <text x="400" y="815" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="28" font-weight="900" letter-spacing="2" fill="#F4F0E8">SIGNATURE WORK</text>
  <text x="400" y="845" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="11" font-weight="400" letter-spacing="3" fill="#A7A39B">EDITORIAL PREVIEW ASSET</text>
</svg>
